name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: EasyTracer-windows-amd64
            archive: zip
          - os: ubuntu-22.04
            artifact: EasyTracer-linux-amd64
            archive: tar.gz
          - os: macos-13
            artifact: EasyTracer-macos-amd64
            archive: tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e .

      # Linux: Install Qt dependencies
      - name: Install Qt dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-keysyms1 \
            libxcb-shape0 \
            libegl1 \
            libgl1-mesa-glx \
            libxcb-xinerama0 \
            libxcb-render-util0 \
            libxcb-randr0

      - name: Build with PyInstaller
        run: pyinstaller easy_tracer.spec --noconfirm

      # Package artifacts
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd dist
          7z a -tzip ${{ matrix.artifact }}.zip easy_tracer

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd dist
          tar -czvf ${{ matrix.artifact }}.tar.gz easy_tracer

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.${{ matrix.archive }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
